# physik as a DreamWeave project: a Jess package. `jess` names the Package Source it
# publishes, the jess.toml at the repository root, and each release tag `physik-<version>` is one
# version of the package, packed by the Mod Template from that tag; every push packs a
# development build.
id = "3059e0aa-40e6-42d1-8db4-ef7832aec8a0"
slug = "physik"
type = "library"
status = "active"

[[maintainers]]
name = "DreamWeave"
url = "https://github.com/DreamWeave-MP"

[package]
format = "jpk"
jess = "org.dreamweave.physik"

[[releases]]
version = "0.3.2"
date = 2026-10-21
summary = "First release published as a DreamWeave project."
