manifest_version = 1

[package]
id = "org.dreamweave.physik"
version = "0.5.0"
jess_api = "1"
include = ["src", "docs", "tests"]
tests = ["tests/physik_test.jsl", "tests/world_test.jsl", "tests/character_test.jsl", "tests/tree_test.jsl"]

[modules]
"@dream/physik" = "src/physik.jsl"
"@dream/physik/character" = "src/character.jsl"

[[layer]]
id = "dream.physik"
exports = ["@dream/physik", "@dream/physik/character"]
